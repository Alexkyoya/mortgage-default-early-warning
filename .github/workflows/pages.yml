name: Deploy portfolio page

on:
  push:
    branches: [main]
    paths: ["portfolio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # portfolio/index.html is a page fragment (no <head>), so wrap it in a full document
      - name: Build site
        run: |
          mkdir -p _site
          {
            echo '<!doctype html>'
            echo '<html lang="en"><head>'
            echo '<meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
            echo '<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>'
            echo '</head><body>'
            cat portfolio/index.html
            echo '</body></html>'
          } > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
